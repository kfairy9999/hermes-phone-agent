[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-phone-agent"
version = "0.1.0"
description = "Guarded outbound SMS and AI calls for Nous Research's Hermes Agent telephony skill."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kevin Fairley" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermes-phone = "hermes_phone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
