name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fetch pinned Hermes telephony.py
        run: |
          curl -fsSL -o "$RUNNER_TEMP/telephony.py" \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.23.0/optional-skills/productivity/telephony/scripts/telephony.py"
      - name: Unit tests and upstream HTTP contract
        env:
          UPSTREAM_TELEPHONY_PY: ${{ runner.temp }}/telephony.py
        run: python -m pytest
      - name: Mock-mode demo
        run: python scripts/demo_mock.py
